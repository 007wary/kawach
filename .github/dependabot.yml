# Monthly update PRs, grouped so there is one PR per ecosystem. CI runs on each.
# Major versions are skipped for Gradle and npm: they need migration work (AGP 9 changes how Kotlin is
# applied; firebase-admin majors change the API behind every alert) and CI can't prove they work at runtime.
# Do those as planned upgrades. Kotlin minor bumps still come through, so check CI before merging.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
